<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurisPlaY - Garzón, Huila</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1>TurisPlaY </h1>
      <p>Descubre y reserva los mejores destinos turísticos de Garzón, Huila</p>
    </div>
  </header>

  <main class="container">
    <section class="sitios-section">
      <div class="section-header">
        <h2>Sitios Turísticos</h2>
        <p>Selecciona un destino para ver detalles y servicios disponibles</p>
      </div>

      <div id="contenedor-sitios" class="grid-sitios">
        <p class="loading-text">Cargando sitios turísticos...</p>
      </div>
    </section>
  </main>

  <!-- Modal Detalle -->
  <div id="modal-detalle" class="modal">
    <div class="modal-content">
      <span class="cerrar-modal" onclick="cerrarModalDetalle()">&times;</span>
      <div id="detalle-sitio-contenido"></div>
    </div>
  </div>

  <!-- Modal Reserva -->
  <div id="modal-reserva" class="modal">
    <div class="modal-content">
      <span class="cerrar-modal" onclick="cerrarModalReserva()">&times;</span>
      <h3>Confirmar Solicitud</h3>
      <p id="lugar-seleccionado-nombre" class="subtitulo-modal"></p>

      <form id="form-reserva">
        <input type="hidden" id="lugar">
        <div class="form-group">
          <label for="nombreUsuario">Nombre Completo</label>
          <input type="text" id="nombreUsuario" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" required placeholder="3130000000">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fechaReserva">Fecha de Reserva</label>
            <input type="date" id="fechaReserva" required>
          </div>
          <div class="form-group">
            <label for="numeroPersonas">Personas</label>
            <input type="number" id="numeroPersonas" min="1" value="1" required>
          </div>
        </div>
        <button type="submit" class="btn-confirmar">Enviar Solicitud</button>
      </form>
      <div id="mensaje-reserva"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 TurisPlaY - SENA Ficha 3229944 · Garzón, Huila</p>
  </footer>

  <script src="app.js"></script>
  <!-- Contenedor para notificaciones flotantes (Toast) -->
<div id="toast" class="toast"></div>
</body>
</html>
